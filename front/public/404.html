<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Redirection...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var locationData = window.location;
        var fullPath = locationData.pathname + locationData.search + locationData.hash;
        var destination = locationData.origin + "/?__redirect=" + encodeURIComponent(fullPath);
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <p>Redirection en cours...</p>
  </body>
</html>
